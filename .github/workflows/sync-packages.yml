name: Sync packages

on:
  schedule:
    # Every 6 hours: a cheap ls-remote check; the full sync only runs when an upstream moved
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync even if no changes detected'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# Never run two syncs at once, so they can't race on pushes or tag numbers
concurrency:
  group: sync-packages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      state_hash: ${{ steps.upstream.outputs.hash }}
      needed: ${{ github.event_name != 'schedule' || steps.last_sync.outputs.cache-hit != 'true' }}
    env:
      SCRIPTS_DIR: ./scripts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check upstream commits
        id: upstream
        env:
          STATE_FILE: ${{ runner.temp }}/upstream-state
        run: |
          bash ${SCRIPTS_DIR}/check-upstream.sh
          echo "hash=$(sha256sum "${STATE_FILE}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # A cache entry keyed by the state hash exists only if a sync already succeeded at this state
      - name: Look up last synced state
        id: last_sync
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/upstream-state
          key: upstream-state-${{ steps.upstream.outputs.hash }}
          lookup-only: true

  sync:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SCRIPTS_DIR: ./scripts
      GIT_AUTHOR_NAME: Lahiru S Liyanage
      GIT_AUTHOR_EMAIL: 125950957+nooblk-98@users.noreply.github.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: bash ${SCRIPTS_DIR}/configure-git.sh

      - name: Auto-discover and sync all packages
        run: bash ${SCRIPTS_DIR}/run-sync-all.sh

      - name: Validate packages
        run: bash ${SCRIPTS_DIR}/validate-packages.sh

      - name: Check changes
        id: check_changes
        run: |
          bash ${SCRIPTS_DIR}/check-changes.sh
          changes=$(cat .changes-detected | tr -d '\n\r')
          echo "changes=${changes}" >> "$GITHUB_OUTPUT"
          echo "Changes detected: ${changes}"

      - name: Commit & push
        if: steps.check_changes.outputs.changes == 'true' || inputs.force_sync == true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/nooblk-98/noobwrt-custom-feeds.git
          bash ${SCRIPTS_DIR}/commit-push.sh

      - name: Tag & release
        if: steps.check_changes.outputs.changes == 'true' || inputs.force_sync == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ${SCRIPTS_DIR}/create-release.sh

      - name: Record synced upstream state
        run: echo "${{ needs.check.outputs.state_hash }}" > "${{ runner.temp }}/upstream-state"

      - name: Save synced upstream state
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/upstream-state
          key: upstream-state-${{ needs.check.outputs.state_hash }}

      - name: Cleanup
        if: always()
        run: bash ${SCRIPTS_DIR}/cleanup.sh
